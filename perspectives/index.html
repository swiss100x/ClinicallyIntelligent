const KEY_SLOT = "ci-preview-key:" + BOX.salt;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(BOX.salt), iterations: BOX.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
async function decrypt(key) {
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(BOX.iv)}, key, b64(BOX.data)));
}
const form = document.getElementById("f"), go = document.getElementById("go"), err = document.getElementById("err");
function setState(s) { form.dataset.state = s; go.disabled = s === "unlocking"; go.textContent = s === "unlocking" ? "Opening…" : "Open"; }
// Swap in the game only once this page has finished loading; replacing a page that is still loading would mix the two.
function show(html) {
  const swap = () => { form.dataset.state = "opened"; document.open(); document.write(html); document.close(); };
  if (document.readyState === "complete") swap(); else window.addEventListener("load", swap, {once: true});
}
function forget() { try { sessionStorage.removeItem(KEY_SLOT); } catch (e) {} }
// Older versions of this page kept the password itself: remove it.
try { sessionStorage.removeItem("nbtu-pw"); } catch (e) {}
form.addEventListener("submit", async e => {
  e.preventDefault();
  if (form.dataset.state === "unlocking") return;
  if (!(window.crypto && crypto.subtle)) { setState("error"); err.textContent = "This browser can’t open the preview. Try an up-to-date Safari, Chrome or Edge."; return; }
  setState("unlocking"); err.textContent = "";
  const input = document.getElementById("pw");
  try {
    const key = await keyFromPassword(input.value);
    const html = await decrypt(key);
    input.value = "";
    try { sessionStorage.setItem(KEY_SLOT, enc(await crypto.subtle.exportKey("raw", key))); } catch (x) {}
    show(html);
  } catch (x) {
    forget(); setState("error"); err.textContent = "That password didn’t work. Check it and try again."; input.select();
  }
});
// Reopen without asking again in this tab only (closing the tab forgets the key).
(async () => {
  let raw = null; try { raw = sessionStorage.getItem(KEY_SLOT); } catch (e) {}
  if (!raw || !(window.crypto && crypto.subtle)) return;
  setState("unlocking");
  try { show(await decrypt(await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]))); }
  catch (e) { forget(); setState("locked"); }
})();
