<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Templates — Clinically Intelligent</title>
<meta name="description" content="The three prompts and the carer guidance template from Issue 04 of Clinically Intelligent. Free downloads for NHS clinicians.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,300,100,1;9..144,400,100,1&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0c0b0a; --ink-2: #141210; --paper: #f4ede0; --paper-2: #ebe2d1; --paper-mute: #6f6757; --rule: #2a2621; --moss: #1f5f3f; --moss-soft: #4a8a68; --amber: #d98a1e; --amber-soft: #e9b367; --ember: #b4601a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--ink); color: var(--paper); font-family: 'Fraunces', serif; font-size: 18px; line-height: 1.55; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; }
  .masthead { border-bottom: 1px solid var(--rule); padding: 18px 0; position: sticky; top: 0; background: rgba(12, 11, 10, 0.94); z-index: 50; }
  .masthead-inner { display: flex; align-items: center; justify-content: space-between; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 12px; text-transform: uppercase; border: 1px solid var(--rule); background: transparent; color: var(--paper); text-decoration: none; cursor: pointer; }
  .btn-primary { background: var(--moss); color: var(--paper); border-color: var(--moss); }
  .prompt-card { border: 1px solid var(--rule); background: var(--ink-2); padding: 44px 40px; margin-bottom: 32px; }
  .prompt-actions { display: flex; gap: 14px; }
  .companion-card { border: 1px solid var(--rule); background: var(--ink); padding: 50px 44px; }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <a href="/">Clinically Intelligent</a>
    <a href="/">← Home</a>
  </div>
</header>

<section class="prompts" style="padding: 90px 0;">
  <div class="wrap">
    <div class="prompt-card">
      <h3>The roleplay prompt.</h3>
      <div class="prompt-actions">
        <a class="btn btn-primary" href="/downloads/Prompt-01-Roleplay-Clinically-Intelligent.pdf">Download .pdf</a>
      </div>
    </div>

    <div class="prompt-card">
      <h3>The operational research prompt.</h3>
      <div class="prompt-actions">
        <a class="btn btn-primary" href="/downloads/Prompt-02-Operational-Research-Clinically-Intelligent.pdf">Download .pdf</a>
      </div>
    </div>

    <div class="prompt-card">
      <h3>The documentation prompt.</h3>
      <div class="prompt-actions">
        <a class="btn btn-primary" href="/downloads/Prompt-03-Documentation-Clinically-Intelligent.pdf">Download .pdf</a>
      </div>
    </div>
  </div>
</section>

<section class="companion" style="padding: 80px 0;">
  <div class="wrap">
    <div class="companion-card">
      <h3>Carer Guidance Template</h3>
      <a class="btn btn-primary" href="/downloads/Issue-04-Complete-Pack-Clinically-Intelligent.pdf">Download .pdf</a>
    </div>
  </div>
</section>

</body>
</html>
