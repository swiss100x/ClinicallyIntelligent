<style>@font-face{font-family:'Fraunces';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/fraunces-latin-400-normal.woff2') format('woff2')}@font-face{font-family:'Fraunces';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/fraunces-latin-600-normal.woff2') format('woff2')}@font-face{font-family:'Fraunces';font-weight:400;font-style:italic;font-display:swap;src:url('fonts/fraunces-latin-400-italic.woff2') format('woff2')}@font-face{font-family:'Inter Tight';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/inter-tight-latin-400-normal.woff2') format('woff2')}@font-face{font-family:'Inter Tight';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/inter-tight-latin-400-normal.woff2') format('woff2')}@font-face{font-family:'Inter Tight';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/inter-tight-latin-700-normal.woff2') format('woff2')}@font-face{font-family:'Caveat';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/caveat-latin-500-normal.woff2') format('woff2')}
:root{--paper:#FFFFFF;--sheet:#F5F7F4;--ink:#1B211D;--soft:#5A645D;--line:#D9DED8;--stamp:#235A3C;--stampd:#1A4430;--stampt:#E3EEE7;--mark:#F4D3B3;--teal:#6B9A7F;--verm:#A8480F;--grey:#B8BEB7;--amber:#CF7A37;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Inter Tight",system-ui,sans-serif;padding-block:16px 56px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
#app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.018em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.08}h2{font-size:26px;line-height:1.15}h3{font-size:19px;line-height:1.25}
p{margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--soft)}
.top img{height:26px;display:block}
.proto{background:var(--stampt);color:var(--stampd);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:500}
/* progress: a ticket edge that gets punched, one hole per step */
.bar{display:flex;justify-content:space-between;align-items:center;position:relative;padding:3px 1px}
.bar::before{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:1.5px dashed var(--line)}
.bar i{position:relative;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--grey);background:var(--paper)}
.bar i.on{background:var(--stamp);border-color:var(--stamp)}
.bar i.now{box-shadow:0 0 0 3.5px var(--stampt)}
.card{display:flex;flex-direction:column;gap:16px;min-width:0}
.soft{color:var(--soft);font-size:15px}
.hl{background:linear-gradient(transparent 12%,var(--mark) 12%,var(--mark) 94%,transparent 94%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;margin:0 -.1em;border-radius:3px 8px 4px 9px}
.btn{font:600 16px "Inter Tight",sans-serif;min-height:52px;border-radius:14px;border:1.5px solid var(--stamp);background:transparent;color:var(--stampd);padding:10px 18px;cursor:pointer}
.btn.main{background:var(--amber);border-color:var(--amber);color:#1B211D}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1 1 140px;padding:10px 10px}
.link{background:none;border:0;padding:6px 0;font:500 15px "Inter Tight",sans-serif;color:var(--stampd);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left;min-height:44px}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.chips{display:flex;flex-direction:column;gap:9px}
.chip{position:relative;font:500 16px "Inter Tight",sans-serif;text-align:left;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:12px 46px 12px 16px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--stamp);background:var(--stampt);color:var(--stampd);box-shadow:inset 0 0 0 1px var(--stamp)}
.chip[aria-pressed=true]::after{content:"";position:absolute;right:18px;top:50%;width:13px;height:7px;border-left:2.5px solid var(--stamp);border-bottom:2.5px solid var(--stamp);transform:translateY(-70%) rotate(-45deg)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.scale .chip{text-align:center;font-size:22px;font-family:Fraunces,serif;font-weight:600;padding:10px 0;min-height:60px}.scale .chip::after{display:none}
.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--soft)}
textarea{font:400 16px/1.45 "Inter Tight",sans-serif;border:1.5px solid var(--line);border-radius:14px;padding:12px;width:100%;min-height:84px;resize:vertical;background:#fff;color:var(--ink)}
.cnt{font-size:13px;color:var(--soft);text-align:right}
label.q{font-weight:600;font-size:16px}
.glance{display:flex;flex-direction:column;gap:14px}
.glance div{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.glance svg{width:44px;height:44px;padding:9px;border-radius:50%;background:var(--stampt)}
.sheet{position:fixed;inset:0;background:var(--paper);overflow:auto;z-index:20;padding:16px max(18px,env(safe-area-inset-left,0px)) 48px}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.fill{background:var(--mark);padding:0 .25em;border-radius:3px;font-weight:500}
.warn{background:#FFF4C2;border:1.5px solid #E5C840;border-radius:12px;padding:10px 12px;font-size:14.5px}
.who{font-size:13.5px;color:var(--soft)}
.tag{display:inline-block;background:var(--stampt);color:var(--stampd);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:500}
/* four working weeks, one dot a day */
.calw{display:flex;align-items:center;gap:16px}
.cal{display:grid;grid-template-columns:repeat(5,14px);gap:7px;padding:12px;border:1.5px solid var(--line);border-radius:14px;flex:none}
.cal i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--grey);transition:background .25s,border-color .25s}
.cal i.on{background:var(--stamp);border-color:var(--stamp)}
/* the ticket */
.ticket{border:1.5px solid var(--ink);border-radius:18px;background:#fff;position:relative;overflow:hidden}
.tktop{padding:20px 20px 16px;position:relative;min-height:128px}
.tkh{font:600 30px/1.08 Fraunces,Georgia,serif;letter-spacing:-.018em;margin-top:4px;max-width:210px}
.tkp{margin-top:8px;max-width:215px}
.tkst{position:absolute;right:12px;top:22px;width:112px}
.tkbody{padding:0 20px 18px;display:flex;flex-direction:column;gap:10px}
.perf{position:relative;border-top:2px dashed var(--line);margin:0 20px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.perf::before{left:-32px}.perf::after{right:-32px}
.tkstub{padding:16px 20px 18px;display:flex;flex-direction:column;gap:6px}
.code{font:600 30px/1.15 Fraunces,Georgia,serif;letter-spacing:.04em;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
.sum{margin:0;display:flex;flex-direction:column;gap:2px}
.sum dt{font-size:13.5px;color:var(--soft)}.sum dd{margin:0 0 8px;font-family:Fraunces,serif;font-weight:600;font-size:19px;line-height:1.2}
.ticket.mini{transform:rotate(-1.4deg);max-width:330px;align-self:center;width:100%}
.ticket.mini .tktop{min-height:112px;padding-bottom:12px}.ticket.mini .tkh{font-size:24px}
.ghost{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-width:170px}.ghost i{height:8px;border-radius:4px;background:var(--sheet);border:1px solid var(--line)}.ghost i:nth-child(2){width:70%}
.ticket.mini .tkstub{padding:12px 20px 14px}.ticket.mini .tkstub i{display:block;height:14px;width:62%;border-radius:4px;background:var(--sheet);border:1px solid var(--line)}
@keyframes press{0%{transform:scale(1.7) rotate(8deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.press{transform-origin:50% 50%;animation:press .5s cubic-bezier(.3,1.3,.5,1) .25s both}
/* Sam's message, on a phone */
.phone{border:2px solid var(--ink);border-radius:30px;background:var(--sheet);padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px}
.pstat{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;padding:0 8px}
.lock{text-align:center;padding:14px 0 4px;display:flex;flex-direction:column}
.lock b{font:600 58px/1 Fraunces,Georgia,serif;letter-spacing:-.02em}.lock span{color:var(--soft);font-size:15px;margin-top:4px}
.note{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;box-shadow:0 6px 18px rgba(27,33,29,.08)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15.5px}
.av{width:38px;height:38px;border-radius:50%;background:var(--stampt);color:var(--stampd);font:600 17px Fraunces,Georgia,serif;display:grid;place-items:center;flex:none}
.chead{display:flex;gap:10px;align-items:center;border-bottom:1.5px solid var(--line);padding:0 4px 10px;font-size:16px}
.thread{display:flex;flex-direction:column;gap:8px;min-height:40px}
.msg{background:#fff;border:1.5px solid var(--line);border-radius:16px 16px 16px 5px;padding:10px 13px;font-size:15.5px;max-width:90%;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--stamp);border-color:var(--stamp);color:#fff;border-radius:16px 16px 5px 16px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.in{animation:rise .3s ease both}
.typing{display:flex;gap:5px;padding:13px 14px;width:58px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--grey);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}}
.reply{border-top:1.5px solid var(--line);padding:12px 2px 0;display:flex;flex-direction:column;gap:10px}.reply h3{font-size:18px}.reply .chip{font-size:15.5px;padding:11px 14px}.reply .chip::after{display:none}
.refl{border-left:3px solid var(--stamp);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--soft)}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.out{opacity:0;height:0;overflow:hidden;transition:opacity .5s}.out.on{opacity:1;height:auto;overflow:visible}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.col{border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);padding:10px 8px;font:inherit;color:inherit;cursor:pointer;text-align:center}
.col[aria-pressed=true]{border-color:var(--stamp)}.col b{display:block;font-size:15px}.col small{display:block;color:var(--soft);font-size:13px;margin-bottom:8px}
.tok{display:inline-block;width:14px;height:14px;margin:2px;border-radius:3px;background:var(--stampt);transition:background .25s}
.tok.r{background:var(--stamp)}.tok.w{background:repeating-linear-gradient(45deg,var(--mark) 0 3px,#F8E3CF 3px 5px);outline:1.5px solid var(--verm);outline-offset:-1.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs .chip{min-height:44px;padding:8px 12px;font-size:15px}.tabs .chip::after{display:none}
.bands{position:relative;height:216px}
.band{position:absolute;left:0;right:0;height:64px;border-bottom:1.5px solid var(--line);font-size:13px;color:var(--soft)}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--stamp);transition:left .8s cubic-bezier(.3,.7,.2,1),top .8s cubic-bezier(.3,.7,.2,1)}
.dot.me{outline:2px dashed var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button.chip:disabled{cursor:default}button.chip:disabled[aria-pressed=false]{opacity:.45}

/* ---- pre-launch changes, 17 November 2026 ---- */
body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px),calc((100vw - 460px)/2)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px),calc((100vw - 460px)/2));background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1.5px solid var(--line)}
.dock .btn{flex:0 0 auto;min-width:0;padding:10px 16px}
.dock .btn.main{flex:1 1 auto}
.btn,.chip,.link{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn,.chip{transition:transform .1s ease-out}
.btn:active:not([disabled]),.chip:active:not([disabled]){transform:scale(.98)}
.btn.main[disabled]{opacity:1;background:var(--sheet);border-color:var(--line);color:var(--soft)}
[tabindex="-1"]:focus{outline:none}
p.q{font-weight:600;font-size:16px}
.dots{display:grid;grid-template-columns:repeat(10,14px);justify-content:space-between;row-gap:10px;padding:2px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--grey);transition:background .25s,border-color .25s}
.dots i.on{background:var(--stamp);border-color:var(--stamp)}
.phone.tap{cursor:pointer}
.reply h3{font:600 15px "Inter Tight",sans-serif;letter-spacing:0;color:var(--soft)}
.reply .chip.sug{border-color:var(--stamp);border-radius:16px 16px 5px 16px;color:var(--stampd)}
.rcpt{align-self:flex-end;font-size:13px;color:var(--soft);padding-right:4px;margin-top:-2px}
.refl{border-left-color:var(--ink);scroll-margin-bottom:128px}
.stamps{display:flex;gap:10px;margin-top:14px}
.stamps svg{width:84px;height:84px;flex:none;display:block}
.ticket.mini .stamps svg{width:66px;height:66px}.ticket.mini .stamps{margin-top:12px}
.ticket:not(.mini) .tktop{min-height:0}.ticket:not(.mini) .tkh,.ticket:not(.mini) .tkp{max-width:none}
@media (prefers-reduced-motion:reduce){.dots i{transition-delay:0s!important}}

/* ---- the message from Sam, as a messaging app in CI's own style ---- */
.phone{padding:10px 0 0;gap:0;overflow:hidden}
.pstat{padding:2px 20px 8px}
.lock{padding:18px 0 10px}
.phone .note{margin:0 12px 16px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;color:var(--soft)}.who b{color:var(--ink);font-weight:600;font-size:15px}
.chead{background:#fff;border-bottom:1.5px solid var(--line);padding:8px 14px 10px;gap:10px}
.chev{flex:none}
.cname{display:flex;flex-direction:column;line-height:1.2}.cname b{font-size:16px}.sub{font-size:12.5px;color:var(--soft)}
.thread{padding:12px 12px 6px;gap:6px}
.day{align-self:center;font-size:12px;color:var(--soft);background:#fff;border-radius:99px;padding:2px 10px;margin-bottom:4px;box-shadow:0 1px 1px rgba(27,33,29,.08)}
.msg{border:0;border-radius:18px 18px 18px 6px;box-shadow:0 1px 1.5px rgba(27,33,29,.14);padding:9px 12px 7px;max-width:86%;line-height:1.38}
.msg.me{border-radius:18px 18px 6px 18px;box-shadow:none}
.msg.typing{padding:13px 14px}
.ts{float:right;font-size:11px;line-height:1;color:var(--soft);margin:9px 0 0 10px}
.msg.me .ts{color:rgba(255,255,255,.78)}
.msg.me.in{animation-delay:.18s}
.rcpt{padding-right:6px;margin-top:0}
.rcpt.in{animation:rise .3s ease .35s both}
.reply{border-top:0;padding:8px 12px 12px;gap:8px}
.reply h3{padding-left:2px}
.reply .chips{align-items:flex-end;gap:8px}
.reply .chip.sug{max-width:94%;min-height:44px;background:#fff;border-radius:18px 18px 6px 18px;padding:10px 13px;font-size:15.5px;line-height:1.38;box-shadow:0 1px 1.5px rgba(27,33,29,.10)}
.comp{display:flex;align-items:center;gap:8px;background:#fff;border-top:1.5px solid var(--line);padding:8px 10px 10px}
.comp .plus,.comp .send{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.comp .send{background:var(--stamp)}
.comp .fld{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;font-size:15px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:34px;line-height:19px}
.comp .fld.go{color:var(--ink)}.comp .fld.go .phd{display:none}
.reply .once{font-size:14px;margin:-2px 0 2px}.tkstub .link[data-cpc]{align-self:flex-start;min-height:44px}.rcpt .link{min-height:0}
.phd{color:#6B746D!important}
</style>
